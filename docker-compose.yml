services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Required}
      SECRET_KEY: ${SECRET_KEY:?Required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Required}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecocycle
      MYSQL_USER: ecocycle
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u ecocycle -p\"$$MYSQL_PASSWORD\" ecocycle -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data: